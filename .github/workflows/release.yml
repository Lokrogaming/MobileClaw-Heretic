name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore release keystore (optional)
        # Wenn die Secrets ANDROID_KEYSTORE_BASE64 + MOBILECLAW_KEYSTORE_PASSWORD
        # gesetzt sind, wird signiert gebaut. Ohne Secrets bleibt der Build
        # unsigniert (Fallback in app/build.gradle.kts) — schadet also nichts.
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/mobileclaw-release.keystore
      - run: ./gradlew assembleRelease
        env:
          MOBILECLAW_KEYSTORE_PASSWORD: ${{ secrets.MOBILECLAW_KEYSTORE_PASSWORD }}
      - uses: softprops/action-gh-release@v2
        with:
          # Unsigned in CI (no keystore), signed locally -> accept both.
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
